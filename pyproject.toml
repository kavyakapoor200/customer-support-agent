[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Calibrated AI Customer Support Agent with Deterministic Gating, System 1 Models, LangGraph HITL, and OpenTelemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Support Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "langgraph>=0.2.34",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.12.0",
    "litellm>=1.50.0",
    "gradio>=5.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests", "eval"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "UP017", "PERF102", "E501", "ASYNC230", "S110"]
