<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241738"/>
      <stop offset="100%" stop-color="#140d21"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e24"/>
      <stop offset="100%" stop-color="#021a14"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362208"/>
      <stop offset="100%" stop-color="#1f1304"/>
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers for Arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1440" height="960" fill="url(#bg-grad)"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1440" y2="120"/>
    <line x1="0" y1="240" x2="1440" y2="240"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="0" y1="840" x2="1440" y2="840"/>
    <line x1="240" y1="0" x2="240" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="960"/>
    <line x1="720" y1="0" x2="720" y2="960"/>
    <line x1="960" y1="0" x2="960" y2="960"/>
    <line x1="1200" y1="0" x2="1200" y2="960"/>
  </g>

  <!-- ====================================================================== -->
  <!-- HEADER SECTION                                                         -->
  <!-- ====================================================================== -->
  <g transform="translate(60, 45)">
    <!-- Title and Subtitle -->
    <text x="0" y="32" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Customer Support Agent Architecture
    </text>
    <text x="0" y="58" font-size="14" font-weight="400" fill="#94a3b8">
      System 1 Gated Decision Engine · Local Kev-0.8B MLX · Deterministic Guardrails · Human-in-the-Loop Supervision
    </text>

    <!-- Badges -->
    <g transform="translate(940, 10)">
      <rect x="0" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
      <text x="30" y="19" font-size="12" font-weight="600" fill="#f8fafc">FastAPI :8000</text>

      <rect x="145" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="161" cy="15" r="5" fill="#a855f7"/>
      <text x="175" y="19" font-size="12" font-weight="600" fill="#f8fafc">Kev-0.8B :8008</text>

      <rect x="290" y="0" width="100" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
      <circle cx="306" cy="15" r="5" fill="#34d399"/>
      <text x="320" y="19" font-size="12" font-weight="600" fill="#f8fafc">Gradio /ui</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="125" x2="1380" y2="125" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ====================================================================== -->
  <!-- ZONE 1: INTAKE & NLU (LEFT COLUMN)                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(60, 160)">
    <!-- Stage 0: Customer Ingestion -->
    <rect x="0" y="0" width="280" height="155" rx="12" fill="url(#card-blue)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="14" width="85" height="22" rx="6" fill="#0369a1" opacity="0.3"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#38bdf8">ENTRY POINT</text>
    <text x="16" y="58" font-size="17" font-weight="700" fill="#f8fafc">Customer Portal &amp; API</text>
    <text x="16" y="80" font-size="12" fill="#94a3b8">Multilingual queries entered via:</text>
    <text x="20" y="102" font-size="12" font-weight="500" fill="#cbd5e1">• Gradio UI: <tspan fill="#38bdf8">http://localhost:8000/ui</tspan></text>
    <text x="20" y="122" font-size="12" font-weight="500" fill="#cbd5e1">• REST API: <tspan fill="#38bdf8">POST /api/v1/tickets</tspan></text>
    <text x="20" y="140" font-size="11" fill="#64748b">Hindi, Hinglish, French, Spanish, English</text>

    <!-- Arrow from Ingestion to Intake Node -->
    <path d="M 140 155 L 140 195" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)"/>

    <!-- Stage 1: Intake & NLU Node -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="280" height="190" rx="12" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="16" y="14" width="95" height="22" rx="6" fill="#0284c7" opacity="0.3"/>
      <text x="24" y="29" font-size="11" font-weight="700" fill="#38bdf8">LANGGRAPH NODE</text>
      <text x="16" y="58" font-size="18" font-weight="700" fill="#ffffff">intake_node</text>
      <text x="16" y="78" font-size="12" fill="#94a3b8">NLU, Language &amp; Entity Extractor</text>

      <rect x="14" y="92" width="252" height="42" rx="6" fill="#0b1324" stroke="#1e293b"/>
      <text x="24" y="109" font-size="11" font-weight="600" fill="#38bdf8">ISO Language Detection</text>
      <text x="24" y="125" font-size="11" fill="#94a3b8">langdetect (55+ ISO) + Hinglish lexicon</text>

      <rect x="14" y="140" width="252" height="42" rx="6" fill="#0b1324" stroke="#1e293b"/>
      <text x="24" y="157" font-size="11" font-weight="600" fill="#38bdf8">Currency Amount Regex</text>
      <text x="24" y="173" font-size="11" fill="#94a3b8">Extracts: $45.00, 180 USD, ₹500</text>
    </g>
  </g>

  <!-- Flow to Middle Column: retrieve_policy & decide -->
  <path d="M 340 460 L 410 460" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- ====================================================================== -->
  <!-- ZONE 2: COGNITION & GROUNDING (CENTER-LEFT COLUMN)                     -->
  <!-- ====================================================================== -->
  <g transform="translate(420, 160)">
    <!-- Stage 2: Qdrant Policy Retrieval -->
    <rect x="0" y="0" width="310" height="155" rx="12" fill="url(#card-purple)" stroke="#6b21a8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="14" width="130" height="22" rx="6" fill="#7e22ce" opacity="0.3"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#c084fc">QDRANT VECTOR DB</text>
    <text x="16" y="58" font-size="18" font-weight="700" fill="#ffffff">retrieve_policy_node</text>
    <text x="16" y="78" font-size="12" fill="#94a3b8">Semantic Policy RAG Grounding (:6333)</text>
    <text x="16" y="104" font-size="12" fill="#e2e8f0">• 14-Day Refund Window SLA</text>
    <text x="16" y="122" font-size="12" fill="#e2e8f0">• Subscription Cancellation Terms</text>
    <text x="16" y="140" font-size="12" fill="#e2e8f0">• P0 Security Incident Protocols</text>

    <!-- Connecting Arrow to Decision Engine -->
    <path d="M 155 155 L 155 205" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Stage 3: Kev-0.8B Decision Engine -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="310" height="265" rx="12" fill="url(#card-purple)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
      <rect x="16" y="14" width="145" height="22" rx="6" fill="#a855f7" opacity="0.25"/>
      <text x="24" y="29" font-size="11" font-weight="700" fill="#e9d5ff">SYSTEM 1 DECISION</text>
      <text x="16" y="58" font-size="18" font-weight="700" fill="#ffffff">decide_node (Kev-0.8B)</text>
      <text x="16" y="78" font-size="12" fill="#c084fc">Jared Palmer's Kev-0.8B on MLX GPU</text>

      <!-- Specifications Box -->
      <rect x="14" y="92" width="282" height="66" rx="6" fill="#140d21" stroke="#3b1d60"/>
      <text x="24" y="110" font-size="11" font-weight="600" fill="#e9d5ff">Engine Details (:8008 /v1/systemone)</text>
      <text x="24" y="127" font-size="11" fill="#cbd5e1">Base: Qwen3.5-0.8B + Pointer Head LoRA</text>
      <text x="24" y="144" font-size="11" fill="#a855f7">Apple Silicon Metal (mps) · ~600ms latency</text>

      <!-- Output Probability Box -->
      <rect x="14" y="168" width="282" height="85" rx="6" fill="#140d21" stroke="#3b1d60"/>
      <text x="24" y="186" font-size="11" font-weight="600" fill="#38bdf8">Single-Pass Probability Distribution:</text>
      <text x="24" y="205" font-size="11" font-family="monospace" fill="#34d399">P(refund)              = 0.94</text>
      <text x="24" y="222" font-size="11" font-family="monospace" fill="#94a3b8">P(cancel_subscription) = 0.04</text>
      <text x="24" y="239" font-size="11" font-family="monospace" fill="#94a3b8">P(general_inquiry)     = 0.02</text>
    </g>
  </g>

  <!-- Flow to Guardrail Gate -->
  <path d="M 730 460 L 800 460" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- ====================================================================== -->
  <!-- ZONE 3: DETERMINISTIC GUARDRAIL GATE (CENTER-RIGHT)                    -->
  <!-- ====================================================================== -->
  <g transform="translate(810, 310)">
    <!-- Deterministic Gate -->
    <rect x="0" y="0" width="280" height="295" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#glow-amber)"/>
    <rect x="16" y="14" width="130" height="22" rx="6" fill="#b45309" opacity="0.3"/>
    <text x="24" y="29" font-size="11" font-weight="700" fill="#fbbf24">DETERMINISTIC GATE</text>
    <text x="16" y="58" font-size="18" font-weight="700" fill="#ffffff">gate_node</text>
    <text x="16" y="76" font-size="12" font-weight="600" fill="#fbbf24">"Model scores, code decides"</text>
    <text x="16" y="94" font-size="11" fill="#94a3b8">Enforces: config/thresholds.yaml</text>

    <!-- Rules Container -->
    <rect x="14" y="108" width="252" height="170" rx="8" fill="#1e160a" stroke="#78350f"/>
    <text x="24" y="128" font-size="11" font-weight="700" fill="#fbbf24">Hard Evaluation Rules:</text>

    <text x="24" y="150" font-size="11" font-weight="600" fill="#f87171">1. P0 Mandatory Review</text>
    <text x="36" y="166" font-size="10" fill="#cbd5e1">SSO/Security lockout -> Always review</text>

    <text x="24" y="186" font-size="11" font-weight="600" fill="#fbbf24">2. Financial Ceiling</text>
    <text x="36" y="202" font-size="10" fill="#cbd5e1">Amount &gt; $50.00 -> Requires Supervisor</text>

    <text x="24" y="222" font-size="11" font-weight="600" fill="#34d399">3. Auto-Execute Threshold</text>
    <text x="36" y="238" font-size="10" fill="#cbd5e1">Confidence &gt;= 0.90 &amp; &lt;= $50 -> Auto</text>

    <text x="24" y="258" font-size="11" font-weight="600" fill="#94a3b8">4. Ambiguity / Deny</text>
    <text x="36" y="272" font-size="10" fill="#cbd5e1">Confidence &lt; 0.60 -> Reject / Clarify</text>
  </g>

  <!-- ====================================================================== -->
  <!-- ZONE 4A: AUTO-EXECUTION FAST PATH (BOTTOM RIGHT)                       -->
  <!-- ====================================================================== -->
  <!-- Path Downwards to Auto-Execute -->
  <path d="M 950 605 L 950 670 L 1130 670" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="965" y="660" font-size="11" font-weight="700" fill="#34d399">APPROVED (Low Risk)</text>

  <g transform="translate(1140, 560)">
    <rect x="0" y="0" width="240" height="215" rx="12" fill="url(#card-green)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="115" height="22" rx="6" fill="#047857" opacity="0.3"/>
    <text x="22" y="29" font-size="11" font-weight="700" fill="#34d399">FAST-PATH (AUTO)</text>
    <text x="14" y="56" font-size="16" font-weight="700" fill="#ffffff">Autonomous Resolution</text>

    <text x="14" y="78" font-size="11" font-weight="600" fill="#34d399">• draft_node (Groq LLM):</text>
    <text x="24" y="94" font-size="11" fill="#cbd5e1">Native language mirroring reply</text>

    <text x="14" y="114" font-size="11" font-weight="600" fill="#34d399">• verify_node:</text>
    <text x="24" y="130" font-size="11" fill="#cbd5e1">Policy invariant verification</text>

    <text x="14" y="150" font-size="11" font-weight="600" fill="#34d399">• execute_node (Tools):</text>
    <text x="24" y="166" font-size="11" fill="#cbd5e1">execute_refund(amount, cust_id)</text>
    <text x="24" y="182" font-size="11" font-family="monospace" fill="#6ee7b7">tx_hash: "tx_9481920412"</text>

    <text x="14" y="202" font-size="11" font-weight="700" fill="#34d399">STATUS: 200 OK COMPLETED</text>
  </g>

  <!-- ====================================================================== -->
  <!-- ZONE 4B: HUMAN-IN-THE-LOOP SUPERVISION (TOP RIGHT)                     -->
  <!-- ====================================================================== -->
  <!-- Path Upwards to Human Review -->
  <path d="M 950 310 L 950 240 L 1130 240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="965" y="230" font-size="11" font-weight="700" fill="#fbbf24">PAUSED (High Risk / P0 / &gt;$50)</text>

  <g transform="translate(1140, 160)">
    <rect x="0" y="0" width="240" height="240" rx="12" fill="url(#card-amber)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="115" height="22" rx="6" fill="#b45309" opacity="0.3"/>
    <text x="22" y="29" font-size="11" font-weight="700" fill="#fbbf24">HUMAN CHECKPOINT</text>
    <text x="14" y="56" font-size="16" font-weight="700" fill="#ffffff">Agent Review Desk</text>

    <text x="14" y="80" font-size="11" font-weight="600" fill="#f59e0b">1. State Machine Interrupted</text>
    <text x="24" y="96" font-size="10" fill="#cbd5e1">Saved to LangGraph thread</text>

    <text x="14" y="116" font-size="11" font-weight="600" fill="#f59e0b">2. Real-Time Webhook Alert</text>
    <text x="24" y="132" font-size="10" fill="#cbd5e1">Dispatches to Slack/Teams</text>

    <text x="14" y="152" font-size="11" font-weight="600" fill="#f59e0b">3. Supervisor Inspection</text>
    <text x="24" y="168" font-size="10" fill="#cbd5e1">Gradio Tab 2 (/ui)</text>

    <!-- Resume Command -->
    <rect x="14" y="184" width="212" height="42" rx="6" fill="#1f1304" stroke="#78350f"/>
    <text x="24" y="201" font-size="10" font-weight="700" fill="#34d399">Resume with Human Verdict:</text>
    <text x="24" y="217" font-size="10" fill="#e2e8f0">• Approve &amp; Execute OR Reject &amp; Deny</text>
  </g>

  <!-- Flow connecting Human Approval back to Execution -->
  <path d="M 1260 400 L 1260 550" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-amber)"/>
  <text x="1268" y="475" font-size="10" font-weight="600" fill="#f59e0b">Resume State</text>

  <!-- ====================================================================== -->
  <!-- ZONE 5: OBSERVABILITY & PERSISTENCE INFRASTRUCTURE (BOTTOM BANNER)    -->
  <!-- ====================================================================== -->
  <g transform="translate(60, 805)">
    <rect x="0" y="0" width="1320" height="105" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <text x="24" y="28" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">UNDERLYING INFRASTRUCTURE &amp; OBSERVABILITY</text>

    <!-- OpenTelemetry & Jaeger -->
    <g transform="translate(24, 42)">
      <rect x="0" y="0" width="300" height="48" rx="8" fill="#111827" stroke="#1e293b"/>
      <circle cx="20" cy="24" r="6" fill="#06b6d4"/>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff">OpenTelemetry &amp; Jaeger (:16686)</text>
      <text x="36" y="38" font-size="11" fill="#94a3b8">OTLP Distributed Spans &amp; Microsecond Traces</text>
    </g>

    <!-- PostgreSQL Persistence -->
    <g transform="translate(348, 42)">
      <rect x="0" y="0" width="300" height="48" rx="8" fill="#111827" stroke="#1e293b"/>
      <circle cx="20" cy="24" r="6" fill="#3b82f6"/>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff">PostgreSQL Audit Store (:5432)</text>
      <text x="36" y="38" font-size="11" fill="#94a3b8">LangGraph Checkpoints &amp; Ticket DB Tables</text>
    </g>

    <!-- Apple Silicon MLX GPU -->
    <g transform="translate(672, 42)">
      <rect x="0" y="0" width="300" height="48" rx="8" fill="#111827" stroke="#1e293b"/>
      <circle cx="20" cy="24" r="6" fill="#a855f7"/>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff">Apple Silicon MLX Metal Acceleration</text>
      <text x="36" y="38" font-size="11" fill="#94a3b8">Kev-0.8B running natively on GPU (mps)</text>
    </g>

    <!-- Webhook Alerting -->
    <g transform="translate(996, 42)">
      <rect x="0" y="0" width="300" height="48" rx="8" fill="#111827" stroke="#1e293b"/>
      <circle cx="20" cy="24" r="6" fill="#f59e0b"/>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff">Webhook Alerts (Slack / Teams)</text>
      <text x="36" y="38" font-size="11" fill="#94a3b8">Instant supervisor dispatch for P0 reviews</text>
    </g>
  </g>
</svg>
